name: Validate

on:
  pull_request:
    paths:
      - "**/SKILL.md"
      - "skills/**"
      - "**/agents/**"
      - ".bb/tasks/**"
      - ".github/scripts/**"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Validate frontmatter
        run: bun .github/scripts/validate-frontmatter.ts

      - name: Lint specs
        run: |
          shopt -s nullglob
          specs=(.bb/tasks/*/spec.md)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "Nenhuma spec em .bb/tasks/ — nada pra lintar."
            exit 0
          fi
          python3 plugins/bb/skills/spec/scripts/lint_spec.py "${specs[@]}"

      - name: Check formatting
        run: bun run fmt:check
