name: Validate

on:
  pull_request:
    paths:
      - "**/SKILL.md"
      - "skills/**"
      - "**/agents/**"
      - ".bb/tasks/**"
      - ".github/scripts/**"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Validate frontmatter
        run: bun .github/scripts/validate-frontmatter.ts

      - name: Lint task briefs
        run: python3 plugins/bb/skills/spec/scripts/lint_spec.py .bb/tasks/*/spec.md

      - name: Check formatting
        run: bun run fmt:check

      - name: Show formatting diff
        if: failure()
        run: |
          bunx oxfmt --write . >/dev/null 2>&1 || true
          git --no-pager diff
