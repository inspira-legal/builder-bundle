name: Validate

on:
  pull_request:
    paths:
      - "**/SKILL.md"
      - "plugins/**"
      - "**/agents/**"
      - ".bb/**"
      - ".github/scripts/**"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Validate frontmatter
        run: bun .github/scripts/validate-frontmatter.ts

      - name: Validate workflow scripts
        run: bun .github/scripts/validate-workflow-script.ts

      - name: Lint specs
        run: |
          shopt -s nullglob
          specs=(.bb/*/spec.md)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "No specs in .bb/: nothing to lint."
            exit 0
          fi
          python3 plugins/bb/skills/spec/scripts/lint_spec.py "${specs[@]}"

      - name: Check formatting
        id: fmt
        run: bun run fmt:check

      # `--check` only names the files, so print the formatter's own diff: whoever
      # reads a red run gets the fix instead of a file list.
      - name: Show what the formatter would change
        if: failure() && steps.fmt.outcome == 'failure'
        run: |
          bun run fmt
          git --no-pager diff
