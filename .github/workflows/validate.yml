name: Validate

on:
  pull_request:
    paths:
      - "**/SKILL.md"
      - "plugins/**"
      - "**/agents/**"
      - ".bb/**"
      - ".github/scripts/**"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Full history: the Lint specs step diffs against the PR's base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Validate frontmatter
        run: bun .github/scripts/validate-frontmatter.ts

      - name: Validate workflow scripts
        run: bun .github/scripts/validate-workflow-script.ts

      # Lint the specs the PR touches, plus the whole corpus whenever the linter
      # itself changed: that corpus run is the only executable coverage the script
      # has, so a PR that edits it proves it against every landed spec. The specs
      # that predate `## Metric` warn on every corpus run by design (W005, no
      # rewrite of history); the diff-aware default keeps that noise off the PRs
      # that leave the linter alone. The diff lands in an assignment so a failed
      # resolve fails the step instead of reading as "nothing to lint".
      - name: Lint specs
        run: |
          if [ -z "${GITHUB_BASE_REF}" ]; then
            echo "::error::no base ref to diff against: this step expects a pull_request run"
            exit 1
          fi
          range="origin/${GITHUB_BASE_REF}...HEAD"
          changed=$(git -c core.quotePath=false diff --diff-filter=d --name-only "$range" -- '.bb/*/spec.md')
          if ! git diff --quiet "$range" -- plugins/bb/skills/spec/scripts/lint_spec.py; then
            echo "lint_spec.py changed: linting the whole corpus."
            shopt -s nullglob
            corpus=(.bb/*/spec.md)
            shopt -u nullglob
            changed=$(printf '%s\n' "${corpus[@]}")
          fi
          if [ -z "$changed" ]; then
            echo "No specs touched by this PR: nothing to lint."
            exit 0
          fi
          mapfile -t specs <<< "$changed"
          python3 plugins/bb/skills/spec/scripts/lint_spec.py "${specs[@]}"

      - name: Check formatting
        id: fmt
        run: bun run fmt:check

      # `--check` only names the files, so print the formatter's own diff: whoever
      # reads a red run gets the fix instead of a file list.
      - name: Show what the formatter would change
        if: failure() && steps.fmt.outcome == 'failure'
        run: |
          bun run fmt
          git --no-pager diff
