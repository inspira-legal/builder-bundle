name: Validate

on:
  pull_request:
    paths:
      - "**/SKILL.md"
      - "plugins/**"
      - "**/agents/**"
      - ".bb/**"
      - ".github/scripts/**"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Full history: the Lint specs step diffs against the PR's base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Validate frontmatter
        run: bun .github/scripts/validate-frontmatter.ts

      - name: Validate workflow scripts
        run: bun .github/scripts/validate-workflow-script.ts

      # Lint the specs the PR touches. The landed specs that predate `## Metric`
      # warn on every run by design (W005, no rewrite of history), and reprinting
      # those same lines on every PR buries the one warning a new spec brings.
      - name: Lint specs
        run: |
          specs=()
          while IFS= read -r spec; do
            [ -f "$spec" ] && specs+=("$spec")
          done < <(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" -- '.bb/*/spec.md')
          if [ ${#specs[@]} -eq 0 ]; then
            echo "No specs touched by this PR: nothing to lint."
            exit 0
          fi
          python3 plugins/bb/skills/spec/scripts/lint_spec.py "${specs[@]}"

      - name: Check formatting
        id: fmt
        run: bun run fmt:check

      # `--check` only names the files, so print the formatter's own diff: whoever
      # reads a red run gets the fix instead of a file list.
      - name: Show what the formatter would change
        if: failure() && steps.fmt.outcome == 'failure'
        run: |
          bun run fmt
          git --no-pager diff
