name: Validate

on:
  pull_request:
    paths:
      - "**/SKILL.md"
      - "plugins/**"
      - "**/agents/**"
      - ".bb/**"
      - ".github/scripts/**"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Validate frontmatter
        run: bun .github/scripts/validate-frontmatter.ts

      - name: Lint specs
        run: |
          shopt -s nullglob
          declare -A seen
          specs=()
          # `.bb/<slug>/` first: the older `.bb/tasks/<slug>/` stays in the scan, and a
          # slug found under both is the same spec, linted once.
          for f in .bb/*/spec.md .bb/tasks/*/spec.md; do
            slug=$(basename "$(dirname "$f")")
            if [ -z "${seen[$slug]:-}" ]; then
              seen[$slug]=1
              specs+=("$f")
            fi
          done
          if [ ${#specs[@]} -eq 0 ]; then
            echo "Nenhuma spec em .bb/ — nada pra lintar."
            exit 0
          fi
          python3 plugins/bb/skills/spec/scripts/lint_spec.py "${specs[@]}"

      - name: Check formatting
        run: bun run fmt:check
