<!doctype html>
<!--
  A first-steps tour scene for /bb:animate-tour, GIF mode.

  `tour.mjs new <slug>` copies this file to ~/Motion/scenes/<slug>/index.html, beside the
  Poppins fonts and icons.js. Write one <template data-step> per step inside <body>, in order.
  Leave the "DO NOT EDIT" blocks alone: they mirror the app's tokens and keyframes
  (references/pattern.md, sections 3 and 4).

  Icons: an empty `i` element with data-icon="paper" and class="ic ic-sm". The name is a file
  in the skill's assets/icons without the .svg; the step mounts it as the design system's SVG.

  Contract with the studio (render.mjs, stills.mjs and tour.mjs record): window.DURATION,
  window.READY and window.seek(t). Preview in a browser with index.html?play, or one step with
  index.html?play&step=2.
-->

      @keyframes tour-stepIn {
        from {

          transform: translateY(6px);
        }
        to {

        }

        55% {

    <script>
      // ===== DO NOT EDIT: the scene contract =====
      // A step mounts from scratch, the way each step is a fresh component in the app, and seek
      // pauses every CSS animation at the asked time. Same t, same pixels.
      const templates = [...document.querySelectorAll("template[data-step]")].sort(
        (a, b) => Number(a.dataset.step) - Number(b.dataset.step),
      );
      const stage = document.getElementById("stage");
      const icons = window.ICONS || {};
      window.MISSING_ICONS = [];
      window.STEPS = templates.map((t) => Number(t.dataset.duration || 4));
      window.DURATION = window.STEPS.reduce((a, b) => a + b, 0);

      let mounted = -1;
      const mount = (i) => {
        if (i === mounted) return;
        const wrap = document.createElement("div");
        wrap.className = "step";
        wrap.appendChild(templates[i].content.cloneNode(true));
        for (const el of wrap.querySelectorAll("i[data-icon]")) {
          const svg = icons[el.dataset.icon];
          if (svg) el.innerHTML = svg;
          else {
            el.classList.add("ic-missing");
            window.MISSING_ICONS.push(el.dataset.icon);
          }
        }
        stage.replaceChildren(wrap);
        mounted = i;
      };
      const freeze = (t) =>
        document.getAnimations().forEach((a) => {
          a.pause();
          a.currentTime = t * 1000;
        });

      // Seconds after which every finite animation of step i (pop, stepIn, checkPop...) has settled.
      window.settledAt = (i) => {
        mount(i);
        return (
          Math.max(
            0,
            ...document.getAnimations().map((a) => {
              const end = a.effect.getComputedTiming().endTime;
              return Number.isFinite(end) ? end : 0;
            }),
          ) / 1000
        );
      };
      window.seekStep = (i, t) => {
        mount(i);
        freeze(t);
      };
      window.seek = (t) => {
        let i = 0;
        let start = 0;
        while (i < window.STEPS.length - 1 && t >= start + window.STEPS[i])
          start += window.STEPS[i++];
        window.seekStep(i, t - start);
      };
      window.READY = Promise.all(
        ["400", "500", "600"].map((w) => document.fonts.load(`${w} 12px Poppins`)),
      );

      // Preview in a normal browser: index.html?play, or index.html?play&step=2 to hold one step.
      const query = new URLSearchParams(location.search);
      if (query.has("play"))
        window.READY.then(() => {
          const only = query.has("step") ? Number(query.get("step")) - 1 : -1;
          const t0 = performance.now();
          const loop = () => {
            const t = (performance.now() - t0) / 1000;
            if (only >= 0) window.seekStep(only, t % window.STEPS[only]);
            else window.seek(t % window.DURATION);
            requestAnimationFrame(loop);
          };
          loop();
        });
    </script>
  </body>
</html>
