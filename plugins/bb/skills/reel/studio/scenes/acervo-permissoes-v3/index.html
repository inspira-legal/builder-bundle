    $("wselT").textContent = t >= 16.4 ? "Edição" : "Visualização";
    const lo =
      sp(t, 5.5, "snappy") - sc(t, 6.15, "snappy") + (sp(t, 6.8, "snappy") - sc(t, 7.4, "snappy"));
    tf("plist", 0, -8 * (1 - clamp(lo)), 1, clamp(lo));
    $("pin").classList.toggle("focus", lo > 0.3);
    PEOPLE.forEach((_, i) => hov("pl" + i, lo > 0.5));
    const ro = sp(t, 8.15, "snappy") - sc(t, 8.75, "snappy");
    tf("rolem", 0, -8 * (1 - clamp(ro)), 1, clamp(ro));
    hov("ro0", ro > 0.5);
    hov("ro1", ro > 0.5);
    const wo = sp(t, 15.85, "snappy") - sc(t, 16.45, "snappy");
    tf("wrole", 0, -8 * (1 - clamp(wo)), 1, clamp(wo));
    hov("wo0", wo > 0.5);
    hov("wo1", wo > 0.5);
    $("wsel").classList.toggle("focus", wo > 0.3);
    const onSav = mo > 0.5 && inside(ph2 ? "savB" : "savA");
    $("sav").style.background = onSav ? "var(--navy1)" : "var(--navy3)";
    $("sav").style.transform = onSav && pressing ? "scale(.95)" : "";

    // after save: avatars on the folder and its subfolders (inherited access)
    pop("fav1", 9.9, t);
    pop("fav2", 10.02, t);
    [0, 1].forEach((i) => {
      pop(`s${i}a1`, 10.15 + i * 0.1, t);
      pop(`s${i}a2`, 10.27 + i * 0.1, t);
    });
    const nk = sp(t, 10.6, "snappy");
    tf("toast", 60 * (1 - nk), 0, 1, t < 10.6 ? 0 : clamp(nk * 2) * (1 - sc(t, 12.3, "snappy")));

    // badge morph Privativa -> Workspace · Edição (one shape, width springs)
    const bk = sp(t, 17.35, "snappy");
    $("mb").style.width = lerp(126, 232, bk) + "px";
    $("mbP").style.opacity = 1 - clamp(bk * 2);
    $("mbW").style.opacity = clamp(bk * 2 - 0.6);
    $("mb").style.background = t > 17.35 ? `rgba(219,230,250,${0.9 * (1 - sc(t, 18.1))})` : "";
    $("gc1").style.borderColor = t > 17.3 && t < 18.2 ? "var(--sky6)" : "";

    // chapter lower-third (screen space)
    const CH = [
      [3.0, 9.55, "01 · PRIVATIVA", "Só você e quem você convidar."],
      [9.8, 12.35, "NOTIFICAÇÃO", "Quem ganha acesso é avisado na hora."],
      [13.0, 17.9, "02 · WORKSPACE", "Todo o escritório, com a regra que você define."],
    ];
    const ch = CH.find((c) => t >= c[0] - 0.05 && t < c[1] + 0.6);
    if (ch) {
      const ki = sp(t, ch[0], "heavy"),
        ko = sc(t, ch[1], "snappy");
      tf("lt", -40 * (1 - ki), 0, 1, clamp(ki * 1.5) * (1 - ko));
      $("ltk").textContent = ch[2];
      $("ltt").textContent = ch[3];
      tf("ltk", 0, (1 - sp(t, ch[0] + 0.1, "heavy")) * 30);
      tf("ltt", 0, (1 - sp(t, ch[0] + 0.2, "heavy")) * 50);
    } else $("lt").style.opacity = 0;
    $("oA").style.opacity = 0;
    $("fchips").style.opacity = 0;

    // hook (lifts away)
    tf("hook", 0, -sp(t, 2.2, "heavy") * 1300);
    if (t < 3) hero_t("h", t, 0.25);

    // navy: circle wipe -> principles -> end card
    const wipe = sp(t, 18.3, "heavy");
    $("end").style.display = t < 18.3 ? "none" : "block";
    $("end").style.clipPath = `circle(${Math.max(wipe, 0) * 1300}px at 960px 540px)`;
    if (t >= 18.3) {
      tf("eb1", Math.sin(t * 0.3) * 120, Math.cos(t * 0.25) * 80);
      tf("eb2", Math.sin(t * 0.3 + 2) * 120, Math.cos(t * 0.25 + 2) * 80);
      const ln = (id, t0, t1, h) =>
        tf(id, 0, (1 - sp(t, t0, "heavy")) * h - sc(t, t1, "heavy") * h);
      $("prc").style.display = t < 22.1 ? "block" : "none";
      $("r4").style.transform = `scaleX(${sc(t, 18.6, "heavy") * (1 - sc(t, 21.5, "heavy"))})`;
      PRINC.forEach((_, i) => {
        const a = 18.9 + i * 0.35;
        ln("n" + i, a, 21.4, 130);
        ln("t" + i, a + 0.12, 21.45, 130);
        ln("q" + i, a + 0.24, 21.5, 120);
      });
      $("fin").style.display = t >= 21.9 ? "block" : "none";
      const lk = sp(t, 22.0, "default");
      tf("logo", 0, 0, Math.max(0, lk), clamp(lk));
      ln("e1", 22.2, 99, 150);
      ln("e2", 22.4, 99, 150);
      ln("e3", 22.9, 99, 60);
      ln("e4", 23.5, 99, 50);
      $("er").style.transform = `scaleX(${sc(t, 23.2, "heavy")})`;
    }
  };

  // preview in a normal browser: open index.html?play
  if (location.search.includes("play"))
    window.READY.then(() => {
      const t0 = performance.now();
      const loop = () => {
        window.seek(((performance.now() - t0) / 1000) % window.DURATION);
        requestAnimationFrame(loop);
      };
      loop();
    });
</script>
