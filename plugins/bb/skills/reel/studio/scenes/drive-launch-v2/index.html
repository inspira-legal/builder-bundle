<!doctype html>
<meta charset="utf-8" />
<style>

    font-family: Poppins;
    font-weight: 400;
    src: url(assets/poppins-400.woff2);
  }
  @font-face {
    font-family: Poppins;
    font-weight: 500;
    src: url(assets/poppins-500.woff2);
  }
  @font-face {
    font-family: Poppins;
    font-weight: 600;
    src: url(assets/poppins-600.woff2);
  }
  :root {
    --navy5: #0e1634;
    --navy4: #151e42;
    --navy3: #1c264f;
    --navy1: #2f3b6a;
    --sky1: #fafcff;
    --sky2: #ecf2fd;
    --sky3: #dbe6fa;
    --sky6: #a8c3f5;
    --sky10: #5187ec;
    --n1: #fff;
    --n2: #f6f7f9;
    --n3: #eef0f3;
    --n4: #e8e9ec;
    --n5: #dcdee0;
    --n7: #c1c4c7;
    --n8: #8e9399;
    --n9: #656c74;
    --n10: #363f49;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html,
  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: var(--n2);
    font-family: Poppins, sans-serif;
    color: var(--navy3);
  }
  .abs {
    position: absolute;
  }
  .layer {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .blob {
    position: absolute;
    width: 1400px;
    height: 1400px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(168, 195, 245, 0.55), rgba(168, 195, 245, 0));
  }
  .navy {
    background: linear-gradient(135deg, var(--navy5), var(--navy3));
  }
  .blobN {
    position: absolute;
    width: 1500px;
    height: 1500px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(81, 135, 236, 0.33), rgba(81, 135, 236, 0));
  }
  .mask {
    position: absolute;
    overflow: hidden;
    width: 1500px;
  }
  .big {
    font: 600 112px/140px Poppins;
    color: #fff;
    letter-spacing: -2px;
    white-space: nowrap;
  }
  .sky {
    color: var(--sky6);
  }
  .sub {
    font: 400 36px/56px Poppins;
    color: #cfdffc;
    white-space: nowrap;
  }
  .tile {
    position: absolute;
    left: 0;
    width: 200px;
    height: 200px;
    border-radius: 48px;
    display: grid;
    place-items: center;
  }
  .tile.w {
    background: #fff;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.3);
  }
  .tile.i {
    background: linear-gradient(135deg, #7ca4ee, #4a6be0);
    box-shadow: 0 18px 60px rgba(81, 135, 236, 0.5);
  }
  .dot {
    position: absolute;
    left: 96px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--sky6);
  }

  #app {
    position: absolute;
    left: 0;
    top: 0;
    width: 1600px;
    height: 900px;
    transform-origin: 0 0;
    background: var(--n2);
    border-radius: 22px;
    overflow: hidden;
    box-shadow:
      0 50px 120px rgba(14, 22, 52, 0.25),
      0 0 0 1px rgba(14, 22, 52, 0.06);
  }
  #side {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 72px;
    background: var(--navy4);
  }
  .sico {
    position: absolute;
    left: 24px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--n4);
    border-radius: 14px;
    box-shadow: 0 20px 50px rgba(14, 22, 52, 0.16);
  }
  .hov {
    background: var(--sky2) !important;
  }
  .press {
    transform: scale(0.95);
  }
  .mi {
    display: grid;
    grid-template-columns: 28px 1fr;
    column-gap: 12px;
    padding: 13px 16px;
    border-radius: 10px;
  }
  .mi + .mi {
    border-top: 1px solid var(--n3);
  }
  .mi b {
    font: 500 17px/24px Poppins;
    color: var(--navy3);
  }
  .mi span {
    grid-column: 2;
    font: 400 14px/20px Poppins;
    color: var(--n9);
  }
  .mi svg {
    margin-top: 2px;
  }
  .pill {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    padding: 0 18px;
    border: 1.5px solid var(--n5);
    border-radius: 22px;
    background: #fff;
    font: 500 16px Poppins;
    color: var(--navy3);
    white-space: nowrap;
  }
  .rc-card {
    flex: 1;
    height: 78px;
    background: #fff;
    border: 1px solid var(--n4);
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 18px;
  }
  .rc-ic {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--sky2);
    display: grid;
    place-items: center;
  }
  .lbl {
    font: 500 12px Poppins;
    letter-spacing: 1.5px;
    color: var(--n8);
  }
  #comp {
    left: 386px;
    top: 380px;
    width: 900px;
    height: 176px;
    background: #fff;
    border-radius: 18px;
    border: 1.5px solid var(--n4);
    box-shadow: 0 12px 36px rgba(14, 22, 52, 0.07);
  }
  .btn {
    border-radius: 12px;
    display: grid;
    place-items: center;
  }
  .chip {
    left: 0;
    top: 0;
    width: 250px;
    height: 50px;
    background: #fff;
    border: 1px solid var(--n5);
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px 0 8px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(14, 22, 52, 0.1);
    transform-origin: 50% 50%;
  }
  .cic {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: var(--n2);
    position: relative;
    flex: none;
  }
  .spin {
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    border: 2.5px solid var(--sky3);
    border-top-color: var(--sky10);
  }
  .dv {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
  }
  .cn {
    font: 500 15px Poppins;
    color: var(--navy3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .bar {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 3px;
    background: var(--sky10);
  }
  .mini {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 10px;
    background: #fff;
    border-radius: 8px;
    font: 500 13px Poppins;
    white-space: nowrap;
  }
  .cite {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 36px;
    padding: 0 14px;
    border: 1px solid var(--sky6);
    background: var(--sky1);
    border-radius: 18px;
    font: 500 14px Poppins;
    color: var(--navy3);
  }

  #pk {
    left: 336px;
    top: 120px;
    width: 1000px;
    height: 660px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.3);
    font-family: Arial, Helvetica, sans-serif;
    color: #202124;
    transform-origin: 50% 50%;
  }
  .tabs {
    display: flex;
    gap: 44px;
    padding: 0 32px;
    border-bottom: 1px solid #dadce0;
    height: 52px;
    align-items: flex-end;
  }
  .tab {
    font: 15px Arial;
    color: #3c4043;
    padding-bottom: 14px;
    position: relative;
  }
  .tab.on {
    font-weight: 700;
    color: #202124;
  }
  .tab.on:after {
    content: "";
    position: absolute;
    left: -6px;
    right: -6px;
    bottom: 0;
    height: 3px;
    background: #1a73e8;
    border-radius: 3px 3px 0 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 222px);
    gap: 14px 16px;
    padding: 0 32px;
  }
  .pc {
    position: relative;
    border: 1px solid #dadce0;
    border-radius: 8px;
    height: 96px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: #fff;
  }
  .pc.hov {
    background: #f1f3f4 !important;
  }
  .pc.sel {
    background: #e8f0fe !important;
    border-color: #1a73e8;
    box-shadow: inset 0 0 0 1px #1a73e8;
  }
  .thumb {
    width: 30px;
    height: 36px;
    border-radius: 4px;
    color: #fff;
    font: 700 9px Arial;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 5px;
  }
  .pn {
    font: 14px Arial;
    color: #3c4043;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ck {
    position: absolute;
    right: 10px;
    top: 10px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #1a73e8;
    display: grid;
    place-items: center;
    transform: scale(0);
  }
  .gbtn {
    height: 40px;
    padding: 0 22px;
    border-radius: 4px;
    font: 700 14px Arial;
    display: grid;
    place-items: center;
    color: #fff;
    background: #a8c7fa;
  }
  .gbtn.on {
    background: #1a73e8;
  }
  .gbtn2 {
    height: 40px;
    padding: 0 22px;
    border-radius: 4px;
    font: 700 14px Arial;
    display: grid;
    place-items: center;
    border: 1px solid #dadce0;
    color: #3c4043;
  }
  /* vault */
  .th,
  .row {
    display: grid;
    grid-template-columns: 44px 56px 1fr 190px 160px 160px;
    align-items: center;
    padding: 0 20px;
  }
  .th {
    height: 50px;
    background: var(--n2);
    border-radius: 10px;
    font: 500 15px Poppins;
    color: var(--n10);
  }
  .row {
    position: absolute;
    left: 0;
    width: 1448px;
    height: 64px;
    border-bottom: 1px solid var(--n3);
    font: 400 15px Poppins;
    color: var(--n9);
  }
  .cb {
    width: 20px;
    height: 20px;
    border: 1.5px solid var(--n7);
    border-radius: 5px;
  }
  .fi {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    background: var(--n3);
    display: grid;
    place-items: center;
  }
  .rn {
    font: 500 15px Poppins;
    color: var(--navy3);
  }
  .rs {
    font: 400 12px Poppins;
    color: var(--n8);
  }
  .lab {
    font: 600 12px Poppins;
    letter-spacing: 1px;
    color: var(--n9);
    padding: 12px 14px 6px;
  }
  .ai2 {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border-radius: 8px;
    font: 400 15px Poppins;
    color: var(--navy3);
  }
  .gbadge {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 10px;
    border: 1px solid var(--n4);
    border-radius: 8px;
    background: #fff;
    font: 500 13px Poppins;
    color: var(--n10);
    white-space: nowrap;
  }
  .bar9 {
    height: 9px;
    border-radius: 5px;
    background: var(--n4);
    margin-top: 12px;
  }
  .mspin {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid var(--sky3);
    border-top-color: var(--sky10);
  }
  .fchip {
    display: flex;
    align-items: center;
    gap: 14px;
    height: 92px;
    padding: 0 36px;
    border-radius: 46px;
    background: #fff;
    border: 1.5px solid var(--n5);
    font: 500 34px Poppins;
    color: var(--navy3);
    box-shadow: 0 14px 40px rgba(14, 22, 52, 0.14);
  }
</style>

    });

    // home -> thread -> vault
    const ho = sc(t, 12.1, "snappy"),
      vo = sc(t, 15.25, "heavy");
    ["hello", "skills", "recents"].forEach((id, i) => tf(id, 0, -40 * ho, 1, 1 - ho));
    const compY = track(t, 380, [[12.1, 700]]);
    tf("comp", 0, compY - 380, 1, 1 - sc(t, 15.2, "snappy"));
    const n = t < 12.05 ? clamp(Math.floor((t - 10.0) * 30), 0, TEXT.length) : 0;
    const typed = $("typed");
    typed.textContent = n
      ? TEXT.slice(0, n) + (Math.floor(t * 3) % 2 ? "|" : "")
      : "Faça uma pergunta, mencione com o @ ou use uma habilidade com o /";
    typed.style.color = n ? "var(--navy3)" : "var(--n8)";
    typed.style.top =
      track(
        t,
        24,
        [
          [9.0, 86],
          [12.05, 24],
        ],
        "snappy",
      ) + "px";
    $("send").style.background = n ? "var(--navy3)" : "var(--n7)";
    hov("clip", t < 4.2);
    hov("send", t > 11 && t < 12.2);

    // attach menu
    const mo = sp(t, 4.0, "snappy") - sc(t, 5.6, "snappy");
    tf("menu", 0, 14 * (1 - clamp(mo)), 0.9 + 0.1 * mo, clamp(mo));
    ["mi0", "mi1", "mi2", "mi3"].forEach((id) => hov(id, mo > 0.5));

    // google picker (two uses)
    const phase2 = t > 12,
      t0 = phase2 ? 16.95 : 5.65,
      t1 = phase2 ? 19.0 : 8.95,
      SEL = phase2 ? SEL2 : SEL1;
    const po = sp(t, t0, "snappy") - sc(t, t1, "snappy");
    $("bd").style.opacity = clamp(po);
    tf("pk", 0, 30 * (1 - po), 0.94 + 0.06 * po, clamp(po));
    let nSel = 0;
    FILES.forEach((_, i) => {
      tf(
        "pc" + i,
        0,
        18 * (1 - sp(t, t0 + 0.12 + 0.025 * i, "snappy")),
        1,
        sc(t, t0 + 0.1 + 0.025 * i),
      );
      const st = SEL[i],
        on = st !== undefined && t >= st;
      nSel += on;
      $("pc" + i).classList.toggle("sel", on);
      $("ck" + i).style.transform = `scale(${on ? Math.max(sp(t, st, "playful"), 0) : 0})`;
      hov("pc" + i, po > 0.5);
    });
    $("pkc").textContent = nSel ? `${nSel} selecionado${nSel > 1 ? "s" : ""}` : "";
    $("pksel").classList.toggle("on", nSel > 0);
    hov("pksel", po > 0.5 && nSel > 0);

    // chips fly from the picker into the composer, upload, then leave with the message
    CHIPS.forEach((f, i) => {
      const ts = 9.0 + i * 0.08,
        done = 9.85 + i * 0.22,
        k = sp(t, ts),
        c = P["pc" + f];
      const x = lerp(c.cx - 125, 406 + i * 262, k),
        y = lerp(c.cy - 25, compY + 18, k);
      tf(
        "chip" + i,
        x,
        y,
        lerp(0.8, 1, clamp(k)),
        t < ts ? 0 : clamp(k * 3) * (1 - sc(t, 12.05, "snappy")),
      );
      $("sp" + i).style.transform = `rotate(${t * 420}deg)`;
      $("sp" + i).style.opacity = t < done ? 1 : 0;
      $("dv" + i).style.transform = `scale(${t < done ? 0 : Math.max(sp(t, done, "playful"), 0)})`;
      $("bar" + i).style.width = clamp((t - ts) / (done - ts)) * 100 + "%";
      $("bar" + i).style.opacity = 1 - sc(t, done + 0.1);
    });

    // thread: bubble, thinking, streamed answer, citations
    const out = sc(t, 15.2, "snappy");
    $("thread").style.opacity = t < 12.1 ? 0 : 1 - out;
    const kb = sp(t, 12.25, "snappy");
    tf("bubble", 0, 30 * (1 - kb), 1, clamp(kb * 2));
    const ka = sp(t, 12.5);
    tf("ai", 0, 20 * (1 - ka), 1, clamp(ka * 2));
    $("think").style.opacity = 1 - sc(t, 12.95, "snappy");
    $("thsp").style.transform = `rotate(${t * 420}deg)`;
    let budget = Math.max(0, Math.floor((t - 12.95) * 150));
    ANS.forEach((line, i) => {
      const k = Math.min(budget, line.length);
      $("ans" + i).textContent = line.slice(0, k);
      budget -= k;
    });
    ["cite0", "cite1"].forEach((id, i) => {
      const k = sp(t, 13.95 + i * 0.1, "playful");
      tf(id, 0, 0, Math.max(k, 0), clamp(k));
    });

    // vault
    tf("vault", 120 * (1 - sp(t, 15.25, "heavy")), 0, 1, vo);
    $("ind").style.top = track(t, 130, [[15.15, 230]], "snappy") - 22 + "px";
    SIDE.forEach(([id]) => {
      $(id)
        .querySelector("svg")
        .setAttribute("stroke", id === (t > 15.15 ? "sb-vault" : "sb-chat") ? "#fff" : "#cfdffc");
    });
    hov("sb-vault", t > 14 && t < 15.4);
    hov("add", t > 15 && t < 16.4);
    const ao = sp(t, 16.1, "snappy") - sc(t, 16.9, "snappy");
    tf("addm", 0, -10 * (1 - clamp(ao)), 0.92 + 0.08 * ao, clamp(ao));
    ["am0", "am1", "am2", "am3", "am4"].forEach((id) => hov(id, ao > 0.5));
    const shift = 64 * 3 * sp(t, 19.05);
    OLD.forEach((_, i) => {
      $("r" + i).style.top = 50 + i * 64 + shift + "px";
    });
    NEW.forEach((_, j) => {
      const k = sp(t, 19.05 + 0.12 * j),
        done = 19.7 + 0.28 * j,
        e = $("n" + j);
      e.style.top = 50 + j * 64 + "px";
      tf("n" + j, -30 * (1 - k), 0, 1, t < 19.05 ? 0 : clamp(k * 1.5));
      e.style.background =
        j === 1 && t >= 20.5
          ? "#dbe6fa"
          : j === 1 && t > 20.2
            ? "#ecf2fd"
            : `rgba(236,242,253,${1 - sc(t, 20.6)})`;
      $("n" + j + "s").style.display = t < done ? "flex" : "none";
      $("n" + j + "d").style.display = t < done ? "none" : "inline";
      $("n" + j + "sp").style.transform = `rotate(${t * 420}deg)`;
    });
    const dk = sp(t, 20.6, "heavy");
    tf("doc", 720 * (1 - dk), 0, 1, t < 20.6 ? 0 : 1);
    $("dspin").style.opacity = t >= 20.6 && t < 21.05 ? 1 : 0;
    $("dspin").style.transform = `rotate(${t * 420}deg)`;
    const scroll = track(t, 0, [[22.1, 600]], "heavy");
    tf("pages", 0, 24 * (1 - sp(t, 21.05, "snappy")) - scroll, 1, sc(t, 21.05, "snappy"));
    $("pg").textContent = scroll > 420 ? "2" : "1";
    $("cnt").textContent = t >= 19.1 ? "9" : "6";
    $("cnt").style.transform =
      `scale(${t >= 19.1 ? 1 + 0.4 * (1 - spring(t - 19.1, "playful")) : 1})`;

    // outro on light stage
    tf("oA", 0, (1 - sp(t, 23.7, "heavy")) * 120);
    [0, 1, 2].forEach((i) => {
      const k = sp(t, 24.1 + i * 0.15, "playful");
      tf("fc" + i, 0, 0, Math.max(k, 0), clamp(k));
    });

    // hook (lifts away) and end card (circle wipe)
    tf("hook", 0, -sp(t, 2.2, "heavy") * 1300);
    if (t < 3) hero_t("h", t, 0.25);
    const wipe = sp(t, 25.1, "heavy");
    $("end").style.display = t < 25.1 ? "none" : "block";
    $("end").style.clipPath = `circle(${Math.max(wipe, 0) * 1300}px at 960px 540px)`;
    if (t >= 25.1) {
      hero_t("e", t, 25.4);
      const ka = sp(t, 26.1, "snappy");
      tf("avail", -30 * (1 - ka), 0, 0.96 + 0.04 * clamp(ka), t < 26.1 ? 0 : clamp(ka));
    }
  };

  // preview in a normal browser: open index.html?play
  if (location.search.includes("play"))
    window.READY.then(() => {
      const t0 = performance.now();
      const loop = () => {
        window.seek(((performance.now() - t0) / 1000) % window.DURATION);
        requestAnimationFrame(loop);
      };
      loop();
    });
</script>
